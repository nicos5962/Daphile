    [Transcode] -F wmal-flc-*-* -m $CLIENTID$ -p $PLAYER$ -f flac $START$ $END$ $RESAMPLE$ $PATH$
wmal mp3 * *
    # F:{PATH=%f}R:{PATH=%F}T:{START=-s %s}U:{END=-d %w}D:{RESAMPLE=-r %d}B:{BITRATE=-B %B}
    [Transcode] -F wmal-mp3-*-* -m $CLIENTID$ -p $PLAYER$ -f mp3 $START$ $END$ $RESAMPLE$ $BITRATE$ -q $QUALITY$ $PATH$ 
wmal pcm * *
    # F:{PATH=%f}R:{PATH=%F}T:{START=-s %s}U:{END=-d %w}
    [Decode] -F wmal-pcm-*-* -m $CLIENTID$ -p $PLAYER$ -f pcm $START$ $END$ $PATH$
wmal wav daphile *
    # F:{PATH=%f}R:{PATH=%F}T:{START=-s %s}U:{END=-d %w}D:{RESAMPLE=-r %d}
    [Decode] -F wmal-wav-daphile-* -m $CLIENTID$ -p $PLAYER$ -f wav $START$ $END$ $RESAMPLE$ $PATH$
