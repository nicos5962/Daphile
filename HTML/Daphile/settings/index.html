<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<link rel="shortcut icon" type="image/x-icon" href="/Daphile/html/mypage.ico" />
		<title>[% "SERVER_SETTINGS" | string %]</title>

		<link rel="stylesheet" type="text/css" href="/html/ext/resources/css/ext-all-notheme.css" />
		<link rel="stylesheet" type="text/css" href="[% webroot %]slimserver.css?r=[% revision %]" />
		<link rel="stylesheet" type="text/css" id="theme" href="[% webroot %]theme-default.css?r=[% revision %]" />

		<script type="text/javascript">[% PROCESS html/vars.js %]</script>
		<script type="text/javascript" src="[% webroot %]html/js.html?r=[% revision %]"></script>
		<script type="text/javascript">[% PROCESS html/SqueezeJS/Strings.js %]</script>
		<script type="text/javascript" src="[% webroot %]daphile.js?r=[% revision %]"></script>

		<script type="text/javascript">
			DaphileCssTheme('init');
			Ext.onReady(function(){ WallPaper('init'); });
			[% PROCESS jsString id='APPLY' jsId='' %]
			[% PROCESS jsString id='SETTINGS' jsId='' %]
			[% PROCESS jsString id='SETTINGS_CHANGED_CONFIRM' jsId='' %]

			Ext.onReady(function(){
				Settings.init([
				[%- activeTab = 0 -%]
				[%- tabIndex = 0 -%]
				[%- FOREACH tab = topLevelItems -%]
					[%- IF tab.0 == 'BASIC_PLAYER_SETTINGS';
						tab.0 = 'PLAYER';
						tab.1 = playersetup.BASIC_PLAYER_SETTINGS || 'settings/player/basic.html?';
					 -%]
					[%- ELSIF tab.0 == 'ADVANCED_SETTINGS'; tab.1 = additionalLinks.setup.FORMATTING_SETTINGS -%]
					[%- ELSIF tab.0 == 'BEHAVIOR_SETTINGS'; tab.0 = 'MY_MUSIC' -%]
					[%- ELSIF tab.0 == 'SERVER_STATUS'; tab.0 = 'INFORMATION' -%]
					[%- END -%]

					[%-
					IF tab.0 == activePage;
						activeTab = tabIndex; 
					ELSIF activePage && tab.0 == 'PLAYER' && playersetup.${activePage};
						activeTab = tabIndex;
						tab.1 = playersetup.${activePage}; 
					END 
					-%]

					{
						title: '[% tab.0 | string %]',
						url: '[%- tab.1 -%]',
						id: '[% tab.0 %]'
					}[% loop.last ? '' : ',' %]
				        [%- tabIndex = tabIndex + 1 -%]
				[% END -%]
				], [% activeTab %]);
			}, Settings, true);
		</script>

		<link rel="apple-touch-icon" href="[% webroot %]html/images/apple-touch-icon.png"/>
	</head>

	<body class="singlePanel settingsFrame">
		<div id="wallpaper"></div>
	  
	  <script>
			if (window.top == window.self) {
				document.body.className += ' bgcolor';
			}
      </script>
	  
		<div id="inner_header">
			<div id="settingsTabs"></div>
		</div>

		<iframe src="[% webroot %]settings/server/basic.html" name="settings" width="100%" id="maincontent" frameborder="0" scrolling="no" allowtransparency="true" seamless></iframe>
        
		<div id="inner_footer" class="footer">
				<div id="infoTab" class="buttonbar">
					<table id="buttonbar">
						<tr>
							<td><button id=settings_close class='stdclick' onclick='javascript:window.close();'>[% "close" | string %]</button></td>
							<td><button class='stdclick' onclick='Settings.submitSettings();'>[% "apply" | string %]</button></td>
						<tr>
					</table>
				</div>				
		</div>

		<div id="footer">
			<div id="footer_left"></div>
			<div id="footer_content">
			</div>
		</div>
	</body>
</html>
